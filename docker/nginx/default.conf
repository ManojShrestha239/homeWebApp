server {
    listen 80;                         # Nginx listens inside the container on port 80
    server_name localhost homewebapp.manojshrestha239.com.np;                     # Accept any hostname (localhost, or your tunnel domain)
    client_max_body_size 20M;          # Must match php.ini upload limit

    # ---- Laravel API: anything under /api goes to PHP ----
    location /api {
        root /var/www/backend/public;  # Laravel's public folder is the web root
        try_files $uri /index.php?$query_string;   # Unknown paths go to Laravel's router
    }

    # ---- Send every .php request to the PHP-FPM container ----
    location ~ \.php$ {
        root /var/www/backend/public;
        fastcgi_pass app:9000;         # "app" is the Laravel service name in compose
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;        # Standard FastCGI settings shipped with Nginx
    }

    # ---- React frontend: everything else goes to the Vite dev server ----
    location / {
        proxy_pass http://frontend:5173;           # "frontend" is the Node service name
        proxy_http_version 1.1;                    # Needed for WebSockets
        proxy_set_header Upgrade $http_upgrade;    # Hot Module Reload (HMR) uses WebSockets
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;               # Pass the original hostname along
    }
}